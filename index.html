// تشغيل خلط الإجابات مرة واحدة فقط
function shufflePhysicsAnswers() {
  physicsLessons.forEach(lesson => {
    lesson.questions.forEach(question => {
      const correctAnswer = question.options[question.correct];

      for (let i = question.options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [question.options[i], question.options[j]] =
        [question.options[j], question.options[i]];
      }

      question.correct = question.options.indexOf(correctAnswer);
    });
  });
}

];
function showSubjects(){const c=document.getElementById('content');let h='<h1>اختر المادة</h1><div class="list">';subjectsData.forEach((s,i)=>h+=`<button onclick="showLessons(${i})">${s.name}</button>`);h+='</div>';c.innerHTML=h;}
function showLessons(si){currentSubject=si;const c=document.getElementById('content'),s=subjectsData[si];let h=`<h2>${s.name}</h2><div class="list">`;s.lessons.forEach((l,i)=>h+=`<button onclick="startQuiz(${i})">${l.title}</button>`);h+=`<button onclick="showSubjects()">رجوع للمواد</button></div>`;c.innerHTML=h;}
function startQuiz(li){currentLesson=li;currentQuestion=0;score=0;userAnswers=[];showQuestion();}
function showQuestion(){const c=document.getElementById('content'),l=subjectsData[currentSubject].lessons[currentLesson],q=l.questions[currentQuestion];let h=`<h2>${l.title}</h2><p class="question-num">سؤال ${currentQuestion+1} من ${l.questions.length}</p><p class="question">${q.q}</p><div class="list">`;q.options.forEach((o,i)=>h+=`<button onclick="selectAnswer(${i})">${o}</button>`);h+='</div>';c.innerHTML=h;}
function selectAnswer(i){const l=subjectsData[currentSubject].lessons[currentLesson],q=l.questions[currentQuestion];userAnswers.push(i);if(i===q.correct)score++;currentQuestion++;currentQuestion<l.questions.length?showQuestion():showResult();}
function showResult(){const c=document.getElementById('content'),l=subjectsData[currentSubject].lessons[currentLesson];c.innerHTML=`<h2>النتيجة</h2><p class="score">حصلت على ${score} من ${l.questions.length}</p><div class="list"><button onclick="showReview()">مراجعة الإجابات</button><button onclick="showLessons(${currentSubject})">رجوع للدروس</button></div>`;}
function showReview(){const c=document.getElementById('content'),l=subjectsData[currentSubject].lessons[currentLesson];let h='<h2>مراجعة الإجابات</h2>';l.questions.forEach((q,i)=>{const ua=userAnswers[i],ok=ua===q.correct;h+=`<div class="review-item ${ok?'correct':'wrong'}"><p class="question">${q.q}</p><p>إجابتك: ${q.options[ua]??'لم تتم الإجابة'}</p>${ok?'':`<p>الإجابة الصحيحة: ${q.options[q.correct]}</p>`}</div>`});h+=`<button class="back" onclick="showLessons(${currentSubject})">رجوع للدروس</button>`;c.innerHTML=h;}
